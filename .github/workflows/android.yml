# Compila un APK de prueba de Android en cada cambio (descargalo desde la pestaña "Actions" de GitHub)
name: APK de prueba (Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Copiar el juego a la app
        run: npm run build && npx cap sync android

      - name: Compilar APK de prueba
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mate-perfecto-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
